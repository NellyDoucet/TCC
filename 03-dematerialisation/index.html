<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comptabilité 03 - La dématérialisation - ADRAR Formation</title>
<link rel="icon" href="assets/adrar-formation-logo.jpeg">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="access-gate" id="access-gate">
  <div class="access-gate__card">
    <span class="access-gate__icon" data-lucide="lock"></span>
    <h1 class="access-gate__title">Accès protégé</h1>
    <p class="access-gate__text">Saisis le code communiqué par ta formatrice pour ouvrir ce chapitre.</p>
    <form class="access-gate__form" id="access-gate-form" autocomplete="off">
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" class="access-gate__input" id="access-gate-input" placeholder="Code" aria-label="Code d'accès">
      <button type="submit" class="btn btn-primary">Valider</button>
    </form>
    <p class="access-gate__error" id="access-gate-error">Code incorrect, réessaie.</p>
  </div>
</div>
<script>
(function () {
  'use strict';
  var STORAGE_KEY = 'adrar-tcc-unlock-03-dematerialisation';
  var CODE = '804';
  var gate = document.getElementById('access-gate');
  var form = document.getElementById('access-gate-form');
  var input = document.getElementById('access-gate-input');
  var error = document.getElementById('access-gate-error');

  function unlock() {
    try { window.localStorage.setItem(STORAGE_KEY, '1'); } catch (e) {}
    gate.classList.add('is-hidden');
  }

  try {
    if (window.localStorage.getItem(STORAGE_KEY) === '1') {
      gate.classList.add('is-hidden');
    }
  } catch (e) {}

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    if (input.value.trim() === CODE) {
      error.classList.remove('is-visible');
      input.classList.remove('is-invalid');
      unlock();
    } else {
      error.classList.add('is-visible');
      input.classList.add('is-invalid');
      input.select();
    }
  });
})();
</script>
<div class="app-shell">
  <aside class="app-sidebar" id="app-sidebar">
    <div class="sidebar-brand">
      <img src="assets/adrar-formation-logo.jpeg" alt="ADRAR Formation">
      <span class="sidebar-brand__name">ADRAR Formation<br>Comptabilité · Chapitre 03</span>
    </div>
    <nav class="sidebar-nav" aria-label="Sommaire du module">
      <ul class="sidebar-nav__list" id="sidebar-nav-list"></ul>
    </nav>
  </aside>

  <header class="app-header">
    <button type="button" class="app-header__menu-toggle" id="menu-toggle" aria-label="Ouvrir le sommaire">
      <span data-lucide="menu"></span>
    </button>
    <div>
      <div class="app-header__title">La dématérialisation</div>
      <div class="app-header__subtitle">Les normes comptables · Chapitre 03</div>
    </div>
    <div class="app-header__progress">
      <span class="app-header__progress-label" id="header-progress-label">Progression : 0 %</span>
      <div class="progressbar">
        <div class="progressbar__fill" id="header-progress-fill"></div>
      </div>
    </div>
  </header>

  <main class="app-main" id="app-content">
    <div class="app-main-inner">
      <div class="page">
        <p>Chargement du module...</p>
      </div>
    </div>
  </main>
</div>

<script src="js/vendor/lucide.js"></script>
<script src="js/icons.js"></script>
<script src="js/scorm/scorm-api.js"></script>
<script src="js/exercises.js"></script>
<script src="js/app.js"></script>
</body>
</html>
