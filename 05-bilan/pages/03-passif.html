  <h1 class="cc-titre-section">#3 Le passif</h1>

<section class="bloc bloc--centre">
  <p class="cc-message-cle cc-message-cle--surligne" style="margin-top: 0; margin-bottom: var(--pas-4);"><span>Tout ce que l'entreprise doit.</span></p>
  <p>On distingue :</p>
  <div class="deux-colonnes">
    <div class="carte-definition">
      <p class="carte-definition__mot">Les capitaux propres</p>
      <p>Ils sont essentiellement composés du <strong>capital</strong>, des <strong>réserves</strong>, du <strong>résultat de l'exercice</strong> et des <strong>subventions</strong>.</p>
    </div>
    <div class="carte-definition">
      <p class="carte-definition__mot">Les dettes</p>
      <p>Notamment les <strong>emprunts</strong> et les <strong>dettes vis-à-vis des tiers</strong>.</p>
    </div>
  </div>
